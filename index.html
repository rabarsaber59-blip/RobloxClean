<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Roblox Mini Connect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%);
            color: #f8fafc;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Compact Login Card */
        .app-card {
            width: 88%;
            max-width: 310px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.28);
            border-radius: 22px;
            padding: 20px 18px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(14px);
            z-index: 10;
        }

        .avatar-circle {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            margin: 0 auto 12px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2.5px solid #38bdf8;
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .avatar-circle.verified {
            border-color: #22c55e;
            box-shadow: 0 0 24px rgba(34, 197, 94, 0.65);
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .avatar-circle .placeholder-icon {
            font-size: 32px;
            color: #475569;
        }

        h2 {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 5px;
            color: #ffffff;
        }

        p.sub {
            font-size: 11.5px;
            color: #94a3b8;
            margin-bottom: 14px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            font-size: 13px;
            outline: none;
            user-select: text;
        }

        .btn-primary {
            width: 100%;
            padding: 11px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #0284c7, #38bdf8);
            color: #fff;
            font-size: 13.5px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-connect {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(90deg, #16a34a, #22c55e);
            color: #ffffff;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-msg {
            font-size: 11.5px;
            margin-top: 8px;
            min-height: 16px;
            font-weight: 600;
        }

        .hidden {
            display: none !important;
        }

        /* =========================================================
           STAGE 3: COMPACT AVATAR STAGE (MUCH SMALLER!)
           ========================================================= */
        #liveAvatarStage {
            position: fixed;
            bottom: 24px;
            right: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
        }

        .overhead-bubble {
            background: #ffffff;
            color: #0f172a;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12.5px;
            font-weight: 800;
            max-width: 160px;
            word-wrap: break-word;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.45);
            position: relative;
            margin-bottom: 10px;
            opacity: 0;
            transform: translateY(8px) scale(0.9);
            transition: all 0.2s ease;
            pointer-events: none;
        }

        .overhead-bubble.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .overhead-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: #ffffff transparent;
        }

        .stage-avatar-box {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            border: 3px solid #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.45);
            overflow: hidden;
            background: #0f172a;
        }

        .stage-avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .stage-username {
            margin-top: 5px;
            font-size: 11px;
            font-weight: 800;
            color: #4ade80;
            background: rgba(15, 23, 42, 0.9);
            padding: 3px 9px;
            border-radius: 999px;
            border: 1px solid rgba(74, 222, 128, 0.35);
        }

        /* =========================================================
           ULTRA-SMALL DRAGGABLE CUSTOM CHAT BOX
           ========================================================= */
        #draggableChatWindow {
            position: fixed;
            top: 14px;
            left: 14px;
            width: 215px;
            background: rgba(15, 23, 42, 0.96);
            border: 1.5px solid #38bdf8;
            border-radius: 15px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            z-index: 999;
            overflow: hidden;
            touch-action: none;
            transition: width 0.2s, height 0.2s;
        }

        #draggableChatWindow.minimized .chat-body-wrap {
            display: none;
        }

        #draggableChatWindow.minimized {
            width: 155px;
        }

        .chat-header {
            background: linear-gradient(90deg, #0f172a, #1e293b);
            padding: 7px 9px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: grab;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        }

        .chat-header-title {
            font-size: 10.5px;
            font-weight: 800;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .mini-btn {
            border: none;
            border-radius: 6px;
            padding: 3px 6px;
            font-size: 9.5px;
            font-weight: 800;
            cursor: pointer;
            color: #fff;
        }

        .btn-min {
            background: #334155;
        }

        .btn-pip {
            background: #0284c7;
        }

        .btn-disc {
            background: #ef4444;
        }

        .chat-messages {
            height: 85px;
            overflow-y: auto;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 10.5px;
        }

        .chat-msg-item {
            background: rgba(30, 41, 59, 0.9);
            padding: 4px 7px;
            border-radius: 7px;
            color: #f1f5f9;
            word-break: break-word;
            border-left: 2.5px solid #22c55e;
        }

        .chat-msg-item b {
            color: #4ade80;
            margin-right: 3px;
        }

        .chat-input-row {
            display: flex;
            align-items: center;
            padding: 5px;
            background: #090d16;
            border-top: 1px solid #1e293b;
            gap: 4px;
        }

        .chat-input-row input {
            flex: 1;
            width: 100%;
            background: #161f30;
            border: 1px solid #2d3b55;
            color: #ffffff;
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 11px;
            outline: none;
            user-select: text;
        }

        .chat-send-btn {
            background: #22c55e;
            color: #090d16;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chat-footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 7px;
            background: #06090f;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
    </style>
</head>
<body>

    <div class="app-card" id="mainCard">
        <div class="avatar-circle" id="avatarCircle">
            <i class="fa-solid fa-user-astronaut placeholder-icon" id="avatarPlaceholder"></i>
            <img id="avatarImg" crossOrigin="anonymous" alt="Roblox Avatar" />
        </div>

        <!-- SCREEN 1 -->
        <div id="screen1">
            <h2>Roblox Lookup</h2>
            <p class="sub">Enter username to load avatar</p>
            <div class="input-group">
                <input type="text" id="usernameInput" placeholder="Roblox username..." autocomplete="off" />
            </div>
            <button class="btn-primary" id="checkUserBtn">
                <i class="fa-solid fa-magnifying-glass"></i> Verify
            </button>
            <div class="status-msg" id="statusMsg"></div>
        </div>

        <!-- SCREEN 2 -->
        <div id="screen2" class="hidden">
            <h2 id="verifiedNameDisplay">Username</h2>
            <p class="sub" style="color:#4ade80;font-weight:700;">
                <i class="fa-solid fa-circle-check"></i> Ready to Connect
            </p>
            <button class="btn-connect" id="connectBtn">
                <i class="fa-solid fa-plug"></i> connect
            </button>
        </div>
    </div>

    <!-- MINI AVATAR STAGE (Bottom-Right Corner) -->
    <div id="liveAvatarStage" class="hidden">
        <div class="overhead-bubble" id="overheadBubble"></div>
        <div class="stage-avatar-box">
            <img id="stageAvatarImg" crossOrigin="anonymous" alt="Avatar" />
        </div>
        <div class="stage-username" id="stageUsername">@Player</div>
    </div>

    <!-- ULTRA-COMPACT DRAGGABLE CUSTOM CHAT -->
    <div id="draggableChatWindow" class="hidden">
        <div class="chat-header" id="chatDragHandle">
            <div class="chat-header-title">
                <i class="fa-solid fa-grip-vertical"></i>
                <span>Mini Chat</span>
            </div>
            <div class="header-actions">
                <button class="mini-btn btn-min" id="minimizeBtn" title="Minimize">–</button>
                <button class="mini-btn btn-disc" id="disconnectBtn" title="Disconnect">Disconnect</button>
            </div>
        </div>

        <div class="chat-body-wrap">
            <div class="chat-messages" id="chatMessagesList">
                <div class="chat-msg-item">
                    <b>Sys:</b> Mini chat connected!
                </div>
            </div>

            <div class="chat-input-row">
                <input type="text" id="chatInputBox" placeholder="say something" autocomplete="off" />
                <button class="chat-send-btn" id="chatSendBtn">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>

            <div class="chat-footer-bar">
                <button class="mini-btn btn-pip" id="pipFloatBtn" style="width:100%;padding:4px;">
                    <i class="fa-solid fa-up-right-from-square"></i> Float on Home Screen (PiP)
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden Canvas & Video for Picture-in-Picture Background Floating Overlay -->
    <canvas id="pipCanvas" width="300" height="300" class="hidden"></canvas>
    <video id="pipVideo" muted playsinline class="hidden"></video>

    <script>
        const usernameInput = document.getElementById('usernameInput');
        const checkUserBtn = document.getElementById('checkUserBtn');
        const statusMsg = document.getElementById('statusMsg');
        const avatarCircle = document.getElementById('avatarCircle');
        const avatarImg = document.getElementById('avatarImg');
        const avatarPlaceholder = document.getElementById('avatarPlaceholder');

        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');
        const verifiedNameDisplay = document.getElementById('verifiedNameDisplay');
        const connectBtn = document.getElementById('connectBtn');
        const mainCard = document.getElementById('mainCard');

        const liveAvatarStage = document.getElementById('liveAvatarStage');
        const stageAvatarImg = document.getElementById('stageAvatarImg');
        const stageUsername = document.getElementById('stageUsername');
        const overheadBubble = document.getElementById('overheadBubble');

        const draggableChatWindow = document.getElementById('draggableChatWindow');
        const chatDragHandle = document.getElementById('chatDragHandle');
        const chatInputBox = document.getElementById('chatInputBox');
        const chatSendBtn = document.getElementById('chatSendBtn');
        const chatMessagesList = document.getElementById('chatMessagesList');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const minimizeBtn = document.getElementById('minimizeBtn');
        const pipFloatBtn = document.getElementById('pipFloatBtn');

        const pipCanvas = document.getElementById('pipCanvas');
        const pipCtx = pipCanvas.getContext('2d');
        const pipVideo = document.getElementById('pipVideo');

        let currentRobloxUser = { name: '', id: null, avatarUrl: '' };
        let lastPrintedMessage = 'Connected!';

        async function fetchWithTimeout(url, options = {}, ms = 3500) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), ms);
            try {
                const res = await fetch(url, { ...options, signal: ctrl.signal });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        async function fetchRobloxUserFast(username) {
            const cleanName = username.trim();
            const encoded = encodeURIComponent(cleanName);

            const searchEndpoints = [
                `https://users.roproxy.com/v1/users/search?keyword=${encoded}&limit=10`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(`https://users.roblox.com/v1/users/search?keyword=${encoded}&limit=10`)}`,
                `https://corsproxy.io/?${encodeURIComponent(`https://users.roblox.com/v1/users/search?keyword=${encoded}&limit=10`)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://users.roblox.com/v1/users/search?keyword=${encoded}&limit=10`)}`
            ];

            let userId = null;
            let exactName = cleanName;

            try {
                const winner = await Promise.any(
                    searchEndpoints.map(async (url) => {
                        const data = await fetchWithTimeout(url, {}, 3500);
                        if (data && Array.isArray(data.data) && data.data.length > 0) {
                            const exact = data.data.find(u => u.name.toLowerCase() === cleanName.toLowerCase()) || data.data[0];
                            return { id: exact.id, name: exact.name };
                        }
                        throw new Error('No match');
                    })
                );
                userId = winner.id;
                exactName = winner.name;
            } catch (e) {}

            let avatarUrl = `https://tr.rbxcdn.com/30DAY-AvatarHeadshot-72882A36053028B8722B5B670B039511-Png/420/420/AvatarHeadshot/Png/noFilter`;

            if (userId) {
                const thumbUrl = `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=420x420&format=Png&isCircular=false`;
                const thumbRaces = [
                    `https://thumbnails.roproxy.com/v1/users/avatar-headshot?userIds=${userId}&size=420x420&format=Png&isCircular=false`,
                    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(thumbUrl)}`,
                    `https://corsproxy.io/?${encodeURIComponent(thumbUrl)}`
                ];
                try {
                    avatarUrl = await Promise.any(
                        thumbRaces.map(async (u) => {
                            const d = await fetchWithTimeout(u, {}, 3000);
                            if (d?.data?.[0]?.imageUrl) return d.data[0].imageUrl;
                            throw new Error('No img');
                        })
                    );
                } catch (e) {}
            } else {
                avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${encoded}`;
            }

            return { id: userId || Date.now(), name: exactName, avatarUrl };
        }

        // Render Live Floating Picture-in-Picture Frame (Stays on Home Screen & Over Apps!)
        function drawPiPFrame() {
            pipCtx.fillStyle = '#0f172a';
            pipCtx.fillRect(0, 0, 300, 300);

            // Speech bubble at top
            pipCtx.fillStyle = '#ffffff';
            pipCtx.beginPath();
            pipCtx.roundRect(20, 18, 260, 64, 16);
            pipCtx.fill();

            pipCtx.fillStyle = '#0f172a';
            pipCtx.font = 'bold 20px sans-serif';
            pipCtx.textAlign = 'center';
            pipCtx.fillText(lastPrintedMessage.slice(0, 22), 150, 57);

            // Avatar image in center
            try {
                pipCtx.save();
                pipCtx.beginPath();
                pipCtx.arc(150, 175, 68, 0, Math.PI * 2);
                pipCtx.closePath();
                pipCtx.clip();
                pipCtx.drawImage(stageAvatarImg, 82, 107, 136, 136);
                pipCtx.restore();
            } catch (e) {}

            pipCtx.strokeStyle = '#22c55e';
            pipCtx.lineWidth = 5;
            pipCtx.beginPath();
            pipCtx.arc(150, 175, 68, 0, Math.PI * 2);
            pipCtx.stroke();

            // Username at bottom
            pipCtx.fillStyle = '#4ade80';
            pipCtx.font = 'bold 18px sans-serif';
            pipCtx.fillText(`@${currentRobloxUser.name || 'Player'}`, 150, 272);
        }

        setInterval(drawPiPFrame, 400);

        // STEP 1: Verify Username
        checkUserBtn.addEventListener('click', async () => {
            const uname = usernameInput.value.trim();
            if (!uname) return;

            statusMsg.style.color = '#38bdf8';
            statusMsg.textContent = 'Loading (< 1s)...';
            checkUserBtn.disabled = true;

            try {
                const user = await fetchRobloxUserFast(uname);
                currentRobloxUser = user;

                avatarImg.onload = () => {
                    avatarPlaceholder.style.display = 'none';
                    avatarImg.style.display = 'block';
                    avatarCircle.classList.add('verified');
                    verifiedNameDisplay.textContent = `@${user.name}`;
                    screen1.classList.add('hidden');
                    screen2.classList.remove('hidden');
                };
                avatarImg.onerror = () => {
                    avatarImg.src = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(user.name)}`;
                };
                avatarImg.src = user.avatarUrl;
            } finally {
                checkUserBtn.disabled = false;
            }
        });

        // STEP 2: Connect
        connectBtn.addEventListener('click', () => {
            mainCard.classList.add('hidden');
            stageAvatarImg.src = avatarImg.src;
            stageUsername.textContent = `@${currentRobloxUser.name}`;

            liveAvatarStage.classList.remove('hidden');
            draggableChatWindow.classList.remove('hidden');
            drawPiPFrame();
        });

        // STEP 3: Disconnect Button -> Reset back to Home Card
        disconnectBtn.addEventListener('click', async () => {
            if (document.pictureInPictureElement) {
                try { await document.exitPictureInPicture(); } catch (e) {}
            }
            draggableChatWindow.classList.add('hidden');
            liveAvatarStage.classList.add('hidden');
            mainCard.classList.remove('hidden');
            screen2.classList.add('hidden');
            screen1.classList.remove('hidden');
            statusMsg.textContent = 'Disconnected.';
            statusMsg.style.color = '#f87171';
        });

        // Minimize / Expand Toggle
        minimizeBtn.addEventListener('click', () => {
            draggableChatWindow.classList.toggle('minimized');
            minimizeBtn.textContent = draggableChatWindow.classList.contains('minimized') ? '+' : '–';
        });

        // Float on Home Screen Button (Picture-in-Picture)
        pipFloatBtn.addEventListener('click', async () => {
            try {
                drawPiPFrame();
                if (!pipVideo.srcObject) {
                    pipVideo.srcObject = pipCanvas.captureStream(15);
                }
                await pipVideo.play();
                await pipVideo.requestPictureInPicture();
            } catch (err) {
                alert('بۆ ئەوەی چاتەکە لەسەر شاشەی سەرەکی بمێنێتەوە، لە مۆبایلە سامسۆنگەکەت دوگمەی (|||) دابگرە و پەنجە لەسەر ئایکۆنی وێبگەڕەکە ڕابگرە و "Open in pop-up view" هەڵبژێرە!');
            }
        });

        // Print Uncensored Message Above Avatar
        let bubbleTimeout = null;
        const broadcastChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('roblox_custom_chat') : null;

        function displayMessage(senderName, text) {
            lastPrintedMessage = text;
            drawPiPFrame();

            const item = document.createElement('div');
            item.className = 'chat-msg-item';
            item.innerHTML = `<b>${senderName}:</b> `;
            const span = document.createElement('span');
            span.textContent = text;
            item.appendChild(span);
            chatMessagesList.appendChild(item);
            chatMessagesList.scrollTop = chatMessagesList.scrollHeight;

            overheadBubble.textContent = text;
            overheadBubble.classList.add('show');

            if (bubbleTimeout) clearTimeout(bubbleTimeout);
            bubbleTimeout = setTimeout(() => {
                overheadBubble.classList.remove('show');
            }, 6000);
        }

        function sendChatMessage() {
            const msg = chatInputBox.value.trim();
            if (!msg) return;
            displayMessage(currentRobloxUser.name || 'You', msg);
            if (broadcastChannel) {
                broadcastChannel.postMessage({ user: currentRobloxUser.name || 'Player', text: msg });
            }
            chatInputBox.value = '';
        }

        if (broadcastChannel) {
            broadcastChannel.onmessage = (ev) => {
                if (ev.data && ev.data.text) displayMessage(ev.data.user, ev.data.text);
            };
        }

        chatSendBtn.addEventListener('click', sendChatMessage);
        chatInputBox.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendChatMessage();
        });

        // Draggable Mini Chat Window
        let isDragging = false, offsetX = 0, offsetY = 0;

        chatDragHandle.addEventListener('pointerdown', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            isDragging = true;
            const rect = draggableChatWindow.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            chatDragHandle.setPointerCapture(e.pointerId);
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const maxX = window.innerWidth - draggableChatWindow.offsetWidth;
            const maxY = window.innerHeight - draggableChatWindow.offsetHeight;
            draggableChatWindow.style.left = `${Math.max(4, Math.min(maxX - 4, e.clientX - offsetX))}px`;
            draggableChatWindow.style.top = `${Math.max(4, Math.min(maxY - 4, e.clientY - offsetY))}px`;
        });

        window.addEventListener('pointerup', () => { isDragging = false; });
    </script>
</body>
</html>
