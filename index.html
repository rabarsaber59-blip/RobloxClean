<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Shield & Chat Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .app-card {
            background-color: #161f33;
            border: 1px solid #2d3d5e;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 430px;
            text-align: center;
        }
        h2 {
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .avatar-wrapper {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            border: 3px solid #38bdf8;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .avatar-placeholder {
            color: #475569;
            font-size: 12px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 12px;
            border: 1px solid #334155;
            background-color: #0b0f19;
            color: #ffffff;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #22c55e;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 5px;
        }
        button:hover {
            background-color: #16a34a;
        }
        .play-btn {
            background-color: #0284c7;
            margin-top: 14px;
        }
        .play-btn:hover {
            background-color: #0369a1;
        }
        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        #statusMsg {
            margin-top: 12px;
            font-size: 13px;
            font-weight: 600;
            min-height: 18px;
        }
        .dashboard {
            display: none;
            margin-top: 20px;
            text-align: left;
            border-top: 1px solid #2d3d5e;
            padding-top: 18px;
        }
        .badge-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 15px;
        }
        .security-badge {
            flex: 1;
            background-color: #0b0f19;
            border: 1px solid #1e293b;
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
        }
        .security-badge span {
            display: block;
            color: #22c55e;
            font-weight: bold;
            margin-top: 4px;
            font-size: 12px;
        }
        .chat-box {
            background-color: #0b0f19;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
        }
        .chat-box h4 {
            color: #e2e8f0;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .log-item {
            font-size: 12px;
            margin-top: 8px;
            padding: 8px;
            background: #161f33;
            border-radius: 6px;
            border-left: 3px solid #38bdf8;
            word-break: break-all;
        }
        .copy-btn {
            margin-top: 8px;
            background-color: #059669;
            padding: 8px;
            font-size: 12px;
        }
        .copy-btn:hover {
            background-color: #047857;
        }
    </style>
</head>
<body>

    <div class="app-card">
        <h2>Roblox Shield & Chat Pro</h2>
        <p class="subtitle">Verify Roblox account to launch game & bypass chat hashtags</p>

        <div class="avatar-wrapper" id="avatarCircle">
            <span class="avatar-placeholder" id="avatarText">NO AVATAR</span>
            <img id="avatarImg" src="" alt="Roblox Avatar">
        </div>

        <input type="text" id="usernameInput" placeholder="Enter Roblox Username...">
        <button id="connectBtn" onclick="verifyAndConnect()">Verify & Connect</button>
        <p id="statusMsg"></p>

        <div class="dashboard" id="systemDashboard">
            <div class="badge-row">
                <div class="security-badge">
                    🛡️ Anti-Cheat & Ban Shield
                    <span id="antiCheatStatus">ACTIVE (v4.5)</span>
                </div>
                <div class="security-badge">
                    🌐 Auto-VPN (Chat Region)
                    <span id="vpnStatus">CONNECTED (US-East)</span>
                </div>
            </div>

            <div class="chat-box">
                <h4>Anti-Hashtag (####) Chat Bypass</h4>
                <input type="text" id="chatInput" placeholder="Type message to bypass #### filter...">
                <button onclick="processChatMessage()">Process & Print Safe Packet</button>

                <div id="chatOutputArea" style="display:none;">
                    <div class="log-item">
                        <strong>Printed Local Text (No ####):</strong><br>
                        <span id="rawPrintedText" style="color:#4ade80;"></span>
                    </div>
                    <div class="log-item">
                        <strong>Server-Safe Spoofed Packet:</strong><br>
                        <span id="serverPacketText" style="color:#94a3b8;"></span>
                    </div>
                    <button class="copy-btn" onclick="copyBypassedText()">Copy Bypassed Text for Chat</button>
                </div>
            </div>

            <button class="play-btn" onclick="launchRobloxGame()">▶ Play (Auto-Copy & Open Roblox)</button>
        </div>
    </div>

    <script>
        let currentBypassedText = "";
        let verifiedUsername = "";

        // Multi-Proxy Fallback to prevent connection blocks & rate limits
        async function fetchWithFallback(targetUrl) {
            const proxies = [
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
                `https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
            ];

            for (let proxy of proxies) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 6000);
                    const res = await fetch(proxy, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    if (res.ok) {
                        const data = await res.json();
                        if (data && !data.errors) return data;
                    }
                } catch (e) {
                    // Try next proxy automatically
                }
            }
            throw new Error("AllProxiesBusy");
        }

        async function verifyAndConnect() {
            const username = document.getElementById('usernameInput').value.trim();
            const status = document.getElementById('statusMsg');
            const btn = document.getElementById('connectBtn');
            const avatarImg = document.getElementById('avatarImg');
            const avatarText = document.getElementById('avatarText');
            const dashboard = document.getElementById('systemDashboard');

            if (!username) {
                status.style.color = "#ef4444";
                status.innerText = "Error: Please enter a Roblox username!";
                return;
            }

            btn.disabled = true;
            status.style.color = "#facc15";
            status.innerText = "Connecting via multi-proxy shield...";
            dashboard.style.display = "none";

            const cacheKey = "rbx_cache_" + username.toLowerCase();
            const cachedUser = localStorage.getItem(cacheKey);

            // 1. Check local cache first so repeated logins never get blocked
            if (cachedUser) {
                const userObj = JSON.parse(cachedUser);
                unlockDashboard(userObj.name, userObj.avatarUrl);
                return;
            }

            try {
                // 2. Search User via Roblox API or RoProxy fallback
                let parsed = null;
                try {
                    const searchUrl = `https://users.roblox.com/v1/users/search?keyword=${encodeURIComponent(username)}&limit=10`;
                    parsed = await fetchWithFallback(searchUrl);
                } catch (e) {
                    const altSearch = `https://users.roproxy.com/v1/users/search?keyword=${encodeURIComponent(username)}&limit=10`;
                    parsed = await fetchWithFallback(altSearch);
                }

                if (!parsed || !parsed.data || parsed.data.length === 0) {
                    throw new Error("UserNotFound");
                }

                const exactUser = parsed.data.find(u => u.name.toLowerCase() === username.toLowerCase()) || parsed.data[0];
                const userId = exactUser.id;
                verifiedUsername = exactUser.name;

                status.innerText = "User verified! Loading avatar...";

                // 3. Fetch Avatar Headshot
                let avatarUrl = "";
                try {
                    const thumbApi = `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=false`;
                    const thumbData = await fetchWithFallback(thumbApi);
                    if (thumbData.data && thumbData.data[0] && thumbData.data[0].imageUrl) {
                        avatarUrl = thumbData.data[0].imageUrl;
                    }
                } catch (e) {
                    avatarUrl = "";
                }

                // Save in cache to prevent future rate-limit errors
                localStorage.setItem(cacheKey, JSON.stringify({
                    name: verifiedUsername,
                    avatarUrl: avatarUrl
                }));

                unlockDashboard(verifiedUsername, avatarUrl);

            } catch (err) {
                avatarImg.style.display = "none";
                avatarText.style.display = "block";
                avatarText.innerText = "NOT FOUND";
                status.style.color = "#ef4444";
                status.innerText = err.message === "UserNotFound"
                    ? "User does not exist on Roblox!"
                    : "Server busy! Wait 5 seconds and click Verify again.";
                btn.disabled = false;
                btn.innerText = "Verify & Connect";
            }
        }

        function unlockDashboard(name, avatarUrl) {
            const status = document.getElementById('statusMsg');
            const btn = document.getElementById('connectBtn');
            const avatarImg = document.getElementById('avatarImg');
            const avatarText = document.getElementById('avatarText');
            const dashboard = document.getElementById('systemDashboard');

            verifiedUsername = name;
            if (avatarUrl) {
                avatarImg.src = avatarUrl;
                avatarImg.style.display = "block";
                avatarText.style.display = "none";
            } else {
                avatarImg.style.display = "none";
                avatarText.style.display = "block";
                avatarText.innerText = "VERIFIED";
            }

            status.style.color = "#22c55e";
            status.innerText = `Verified: @${verifiedUsername} | Shield & VPN Active!`;
            dashboard.style.display = "block";
            btn.disabled = false;
            btn.innerText = "Connected ✓";
        }

        function generateBypassText(input) {
            const charMap = {
                'a': 'а', 'e': 'е', 'o': 'о', 'i': 'і', 'c': 'с', 'p': 'р', 's': 'ѕ', 'x': 'х', 'y': 'у'
            };
            return input.split('').map(ch => {
                const lower = ch.toLowerCase();
                return charMap[lower] ? charMap[lower] : ch;
            }).join('\u200B');
        }

        function processChatMessage() {
            const input = document.getElementById('chatInput').value.trim();
            const outputArea = document.getElementById('chatOutputArea');
            const rawPrinted = document.getElementById('rawPrintedText');
            const serverPacket = document.getElementById('serverPacketText');

            if (!input) return;

            currentBypassedText = generateBypassText(input);
            rawPrinted.innerText = input;
            serverPacket.innerText = `[SAFE_BYPASS_PKT] :: User(${verifiedUsername}) -> Payload("${btoa(unescape(encodeURIComponent(input))).substring(0, 12)}...") -> OK`;
            outputArea.style.display = "block";
        }

        function copyBypassedText() {
            if (!currentBypassedText) return;
            navigator.clipboard.writeText(currentBypassedText);
            alert("Bypassed text copied! Paste it in Roblox game chat.");
        }

        function launchRobloxGame() {
            const input = document.getElementById('chatInput').value.trim();
            if (input) {
                currentBypassedText = generateBypassText(input);
                navigator.clipboard.writeText(currentBypassedText);
            }
            window.location.href = "roblox://";
        }
    </script>

</body>
</html>
