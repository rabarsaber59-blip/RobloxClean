<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Roblox Connect — Uncensored Avatar Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%);
            color: #f8fafc;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-card {
            width: 92%;
            max-width: 400px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 28px;
            padding: 30px 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(16px);
            z-index: 10;
        }

        .avatar-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 3px solid #38bdf8;
            box-shadow: 0 0 28px rgba(56, 189, 248, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
        }

        .avatar-circle.verified {
            border-color: #22c55e;
            box-shadow: 0 0 35px rgba(34, 197, 94, 0.65);
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .avatar-circle .placeholder-icon {
            font-size: 48px;
            color: #475569;
        }

        h2 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.sub {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 22px;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            font-size: 15px;
            outline: none;
            user-select: text;
        }

        .input-group input:focus {
            border-color: #38bdf8;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(90deg, #0284c7, #38bdf8);
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-connect {
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(90deg, #16a34a, #22c55e);
            color: #ffffff;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(34, 197, 94, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status-msg {
            font-size: 13px;
            margin-top: 12px;
            min-height: 20px;
            font-weight: 600;
        }

        .hidden {
            display: none !important;
        }

        /* STAGE 3: LIVE AVATAR + DRAGGABLE CUSTOM CHAT */
        #liveAvatarStage {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 5;
        }

        .overhead-bubble {
            background: #ffffff;
            color: #0f172a;
            padding: 12px 20px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 800;
            max-width: 300px;
            word-wrap: break-word;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
            position: relative;
            margin-bottom: 18px;
            opacity: 0;
            transform: translateY(10px) scale(0.9);
            transition: all 0.25s ease;
        }

        .overhead-bubble.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .overhead-bubble::after {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #ffffff transparent;
        }

        .stage-avatar-box {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            border: 4px solid #22c55e;
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.5);
            overflow: hidden;
            background: #0f172a;
        }

        .stage-avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .stage-username {
            margin-top: 10px;
            font-size: 16px;
            font-weight: 800;
            color: #4ade80;
            background: rgba(15, 23, 42, 0.85);
            padding: 5px 14px;
            border-radius: 999px;
            border: 1px solid rgba(74, 222, 128, 0.35);
        }

        #draggableChatWindow {
            position: fixed;
            top: 24px;
            left: 24px;
            width: 300px;
            background: rgba(15, 23, 42, 0.95);
            border: 1.5px solid #38bdf8;
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(14px);
            z-index: 999;
            overflow: hidden;
            touch-action: none;
        }

        .chat-header {
            background: linear-gradient(90deg, #0f172a, #1e293b);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: grab;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        }

        .chat-header-title {
            font-size: 13px;
            font-weight: 800;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .chat-messages {
            height: 150px;
            overflow-y: auto;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            font-size: 13px;
        }

        .chat-msg-item {
            background: rgba(30, 41, 59, 0.9);
            padding: 7px 11px;
            border-radius: 10px;
            color: #f1f5f9;
            word-break: break-word;
            border-left: 3px solid #22c55e;
        }

        .chat-msg-item b {
            color: #4ade80;
            margin-right: 5px;
        }

        .chat-input-row {
            display: flex;
            align-items: center;
            padding: 8px;
            background: #090d16;
            border-top: 1px solid #1e293b;
            gap: 6px;
        }

        .chat-input-row input {
            flex: 1;
            background: #161f30;
            border: 1px solid #2d3b55;
            color: #ffffff;
            padding: 9px 12px;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
            user-select: text;
        }

        .chat-send-btn {
            background: #22c55e;
            color: #090d16;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="app-card" id="mainCard">
        <div class="avatar-circle" id="avatarCircle">
            <i class="fa-solid fa-user-astronaut placeholder-icon" id="avatarPlaceholder"></i>
            <img id="avatarImg" alt="Roblox Avatar" />
        </div>

        <!-- SCREEN 1 -->
        <div id="screen1">
            <h2>Roblox Lookup</h2>
            <p class="sub">Enter your Roblox username to load your avatar</p>
            <div class="input-group">
                <input type="text" id="usernameInput" placeholder="Enter Roblox username..." autocomplete="off" />
            </div>
            <button class="btn-primary" id="checkUserBtn">
                <i class="fa-solid fa-magnifying-glass"></i> Verify Username
            </button>
            <div class="status-msg" id="statusMsg"></div>
        </div>

        <!-- SCREEN 2 -->
        <div id="screen2" class="hidden">
            <h2 id="verifiedNameDisplay">Username</h2>
            <p class="sub" style="color:#4ade80;font-weight:700;">
                <i class="fa-solid fa-circle-check"></i> Roblox Avatar Loaded!
            </p>
            <button class="btn-connect" id="connectBtn">
                <i class="fa-solid fa-plug"></i> connect
            </button>
        </div>
    </div>

    <!-- SCREEN 3 -->
    <div id="liveAvatarStage" class="hidden">
        <div class="overhead-bubble" id="overheadBubble"></div>
        <div class="stage-avatar-box">
            <img id="stageAvatarImg" alt="Avatar" />
        </div>
        <div class="stage-username" id="stageUsername">@Player</div>
    </div>

    <div id="draggableChatWindow" class="hidden">
        <div class="chat-header" id="chatDragHandle">
            <div class="chat-header-title">
                <i class="fa-solid fa-grip-vertical"></i>
                <span>Custom Chat (No ###)</span>
            </div>
            <span style="font-size:10px;color:#4ade80;font-weight:800;">● LIVE</span>
        </div>

        <div class="chat-messages" id="chatMessagesList">
            <div class="chat-msg-item">
                <b>System:</b> Connected! Drag this chat box anywhere and type without ### filter!
            </div>
        </div>

        <div class="chat-input-row">
            <input type="text" id="chatInputBox" placeholder="say something" autocomplete="off" />
            <button class="chat-send-btn" id="chatSendBtn">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        const usernameInput = document.getElementById('usernameInput');
        const checkUserBtn = document.getElementById('checkUserBtn');
        const statusMsg = document.getElementById('statusMsg');
        const avatarCircle = document.getElementById('avatarCircle');
        const avatarImg = document.getElementById('avatarImg');
        const avatarPlaceholder = document.getElementById('avatarPlaceholder');

        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');
        const verifiedNameDisplay = document.getElementById('verifiedNameDisplay');
        const connectBtn = document.getElementById('connectBtn');
        const mainCard = document.getElementById('mainCard');

        const liveAvatarStage = document.getElementById('liveAvatarStage');
        const stageAvatarImg = document.getElementById('stageAvatarImg');
        const stageUsername = document.getElementById('stageUsername');
        const overheadBubble = document.getElementById('overheadBubble');

        const draggableChatWindow = document.getElementById('draggableChatWindow');
        const chatDragHandle = document.getElementById('chatDragHandle');
        const chatInputBox = document.getElementById('chatInputBox');
        const chatSendBtn = document.getElementById('chatSendBtn');
        const chatMessagesList = document.getElementById('chatMessagesList');

        let currentRobloxUser = { name: '', id: null, avatarUrl: '' };

        // Helper: fetch with strict 3.5 second timeout so it NEVER hangs!
        async function fetchWithTimeout(url, options = {}, ms = 3500) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), ms);
            try {
                const res = await fetch(url, { ...options, signal: ctrl.signal });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        // Ultra-fast parallel lookup across RoProxy + multiple GET search proxies simultaneously!
        async function fetchRobloxUserFast(username) {
            const cleanName = username.trim();
            const encoded = encodeURIComponent(cleanName);

            const searchEndpoints = [
                `https://users.roproxy.com/v1/users/search?keyword=${encoded}&limit=10`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(`https://users.roblox.com/v1/users/search?keyword=${encoded}&limit=10`)}`,
                `https://corsproxy.io/?${encodeURIComponent(`https://users.roblox.com/v1/users/search?keyword=${encoded}&limit=10`)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://users.roblox.com/v1/users/search?keyword=${encoded}&limit=10`)}`
            ];

            let userId = null;
            let exactName = cleanName;

            try {
                // Race all endpoints at the same time — whichever answers first in <1s wins!
                const winner = await Promise.any(
                    searchEndpoints.map(async (url) => {
                        const data = await fetchWithTimeout(url, {}, 3500);
                        if (data && Array.isArray(data.data) && data.data.length > 0) {
                            const exact = data.data.find(u => u.name.toLowerCase() === cleanName.toLowerCase()) || data.data[0];
                            return { id: exact.id, name: exact.name };
                        }
                        throw new Error('No match');
                    })
                );
                userId = winner.id;
                exactName = winner.name;
            } catch (e) {}

            // Now race thumbnail endpoints in parallel for the avatar headshot image
            let avatarUrl = `https://tr.rbxcdn.com/30DAY-AvatarHeadshot-72882A36053028B8722B5B670B039511-Png/420/420/AvatarHeadshot/Png/noFilter`;

            if (userId) {
                const thumbUrl = `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=420x420&format=Png&isCircular=false`;
                const thumbRaces = [
                    `https://thumbnails.roproxy.com/v1/users/avatar-headshot?userIds=${userId}&size=420x420&format=Png&isCircular=false`,
                    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(thumbUrl)}`,
                    `https://corsproxy.io/?${encodeURIComponent(thumbUrl)}`,
                    `https://api.allorigins.win/raw?url=${encodeURIComponent(thumbUrl)}`
                ];

                try {
                    const imgWinner = await Promise.any(
                        thumbRaces.map(async (u) => {
                            const d = await fetchWithTimeout(u, {}, 3000);
                            if (d?.data?.[0]?.imageUrl) return d.data[0].imageUrl;
                            throw new Error('No image');
                        })
                    );
                    avatarUrl = imgWinner;
                } catch (e) {}
            } else {
                // Instant fallback avatar generator if all public proxies are rate-limited on mobile carrier
                avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${encoded}`;
            }

            return { id: userId || Date.now(), name: exactName, avatarUrl };
        }

        // STEP 1: Verify Username & Show Avatar Inside Circle
        checkUserBtn.addEventListener('click', async () => {
            const uname = usernameInput.value.trim();
            if (!uname) {
                statusMsg.style.color = '#f87171';
                statusMsg.textContent = 'Please enter your Roblox username!';
                return;
            }

            statusMsg.style.color = '#38bdf8';
            statusMsg.textContent = 'Loading avatar (< 1 sec)...';
            checkUserBtn.disabled = true;

            try {
                const user = await fetchRobloxUserFast(uname);
                currentRobloxUser = user;

                const finishTransition = () => {
                    avatarPlaceholder.style.display = 'none';
                    avatarImg.style.display = 'block';
                    avatarCircle.classList.add('verified');
                    verifiedNameDisplay.textContent = `@${user.name}`;
                    screen1.classList.add('hidden');
                    screen2.classList.remove('hidden');
                };

                avatarImg.onload = finishTransition;
                avatarImg.onerror = () => {
                    avatarImg.src = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(user.name)}`;
                };
                avatarImg.src = user.avatarUrl;
            } finally {
                checkUserBtn.disabled = false;
            }
        });

        usernameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkUserBtn.click();
        });

        // STEP 2: Click Green "connect" Button
        connectBtn.addEventListener('click', () => {
            mainCard.classList.add('hidden');
            stageAvatarImg.src = avatarImg.src;
            stageUsername.textContent = `@${currentRobloxUser.name}`;

            liveAvatarStage.classList.remove('hidden');
            draggableChatWindow.classList.remove('hidden');
            chatInputBox.focus();
        });

        // STEP 3: Print Uncensored Message Above Avatar
        let bubbleTimeout = null;
        const broadcastChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('roblox_custom_chat') : null;

        function displayMessage(senderName, text) {
            const item = document.createElement('div');
            item.className = 'chat-msg-item';
            item.innerHTML = `<b>${senderName}:</b> `;
            const span = document.createElement('span');
            span.textContent = text;
            item.appendChild(span);
            chatMessagesList.appendChild(item);
            chatMessagesList.scrollTop = chatMessagesList.scrollHeight;

            overheadBubble.textContent = text;
            overheadBubble.classList.add('show');

            if (bubbleTimeout) clearTimeout(bubbleTimeout);
            bubbleTimeout = setTimeout(() => {
                overheadBubble.classList.remove('show');
            }, 6000);
        }

        function sendChatMessage() {
            const msg = chatInputBox.value.trim();
            if (!msg) return;
            displayMessage(currentRobloxUser.name || 'You', msg);
            if (broadcastChannel) {
                broadcastChannel.postMessage({ user: currentRobloxUser.name || 'Player', text: msg });
            }
            chatInputBox.value = '';
        }

        if (broadcastChannel) {
            broadcastChannel.onmessage = (ev) => {
                if (ev.data && ev.data.text) displayMessage(ev.data.user, ev.data.text);
            };
        }

        chatSendBtn.addEventListener('click', sendChatMessage);
        chatInputBox.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendChatMessage();
        });

        // STEP 4: Draggable Custom Chat Window
        let isDragging = false, offsetX = 0, offsetY = 0;

        chatDragHandle.addEventListener('pointerdown', (e) => {
            isDragging = true;
            const rect = draggableChatWindow.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            chatDragHandle.setPointerCapture(e.pointerId);
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const maxX = window.innerWidth - draggableChatWindow.offsetWidth;
            const maxY = window.innerHeight - draggableChatWindow.offsetHeight;
            draggableChatWindow.style.left = `${Math.max(6, Math.min(maxX - 6, e.clientX - offsetX))}px`;
            draggableChatWindow.style.top = `${Math.max(6, Math.min(maxY - 6, e.clientY - offsetY))}px`;
        });

        window.addEventListener('pointerup', () => { isDragging = false; });
    </script>
</body>
</html>
